@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Rubik:wght@400;500;600;700&display=swap');

:root {
  --ink-950: #08090f;
  --ink-900: #0d0e18;
  --violet-900: #1a1330;
  --line: rgba(255,255,255,0.09);
  --white: #f4f5fb;
  --muted: #a2a6bf;
  --gold: #ffc23c;
  --gold-2: #ff9a2e;
  --cyan: #34d9ff;
  --danger: #ff3b3b;
}

* { box-sizing: border-box; }

body {
  background:
    radial-gradient(1100px 620px at 50% 14%, rgba(255,178,50,0.12), transparent 60%),
    radial-gradient(780px 480px at 6% 96%, rgba(52,217,255,0.09), transparent 60%),
    radial-gradient(780px 480px at 96% 30%, rgba(255,178,50,0.06), transparent 60%),
    linear-gradient(180deg, var(--ink-950) 0%, var(--ink-900) 55%, var(--violet-900) 120%);
  color: var(--white);
  font-family: 'Rubik', system-ui, -apple-system, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  margin: 0;
  padding: 20px 0 96px 0;
  transition: background-color 0.3s ease, filter 0.3s ease;
  position: relative;
  overflow-x: hidden;
  -webkit-user-select: none;
  -ms-user-select: none;
  user-select: none;
}

img { -webkit-user-drag: none; }

/* פסי מהירות עדינים ברקע - רמיזה לתרבות הרכב, בעוצמה נמוכה */
.speed-lines {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: 0.05;
  background-image: repeating-linear-gradient(
    -10deg, #ffffff 0px, #ffffff 1px, transparent 1px, transparent 90px
  );
}

.spotlight {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  pointer-events: none;
  background: radial-gradient(circle at var(--x, 50vw) var(--y, 50vh), rgba(255, 255, 255, 0.05) 0%, transparent 80px);
  z-index: 0;
}

@media (max-width: 768px) {
  .footer-container { font-size: 12px; bottom: 12px; }
  .footer-links { gap: 8px; }
}

.profile-section {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-bottom: 8vh;
  z-index: 1;
}

/* ================= עיגול הפרופיל: טבעת אנרגיה מסתובבת + זוהר ================= */
.avatar-wrap { position: relative; width: 184px; height: 184px; margin-bottom: 6px; }

.avatar-glow {
  position: absolute;
  inset: -34px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,178,50,0.30) 0%, transparent 68%);
  animation: glowBreathe 4.5s ease-in-out infinite;
  z-index: 0;
}

@keyframes glowBreathe {
  0%, 100% { opacity: 0.65; transform: scale(0.96); }
  50% { opacity: 1; transform: scale(1.04); }
}

.avatar-ring {
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, var(--gold), var(--cyan) 35%, var(--gold) 65%, var(--gold-2) 100%);
  animation: spinRing 16s linear infinite;
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
  z-index: 1;
}

@keyframes spinRing { to { transform: rotate(360deg); } }

.profile-pic {
  position: relative;
  z-index: 2;
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--ink-900);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.10), 0 14px 34px rgba(0,0,0,0.55);
}

.profile-name {
  font-family: 'Rajdhani', sans-serif;
  font-size: 42px;
  font-weight: 700;
  letter-spacing: 1.5px;
  background: linear-gradient(180deg, #ffe8b8, var(--gold) 55%, var(--gold-2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 10px rgba(255,178,50,0.25));
  line-height: 1.1;
}

.profile-tagline { font-size: 13.5px; color: var(--muted); letter-spacing: 0.2px; margin-top: -4px; }

/* ================= 1. Kick Live Status Badge ================= */
.kick-status-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 7px 18px;
  border-radius: 20px;
  font-family: 'Rajdhani', system-ui, sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2px;
  direction: ltr;
  transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
  margin-top: 6px;
  user-select: none;
}

.kick-status-badge.offline {
  background-color: rgba(255,255,255,0.04);
  border: 1px solid var(--line);
  cursor: default !important;
  pointer-events: none !important;
  box-shadow: none;
}

.kick-status-badge.offline .status-text { color: #ff5c5c; }

.kick-status-badge.offline .status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background-color: var(--danger); display: inline-block;
}

.kick-status-badge.live {
  background-color: rgba(83,252,24,0.10);
  border: 1px solid rgba(83, 252, 24, 0.5);
  box-shadow: 0 0 16px rgba(83, 252, 24, 0.35), 0 4px 12px rgba(0,0,0,0.4);
  cursor: pointer !important;
  pointer-events: auto !important;
}

.kick-status-badge.live:hover {
  transform: scale(1.06);
  filter: brightness(1.15);
  box-shadow: 0 0 22px rgba(83, 252, 24, 0.55);
}

.kick-status-badge.live .status-text { color: #53fc18; }

.kick-status-badge.live .status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background-color: #ff0000; display: inline-block;
  animation: liveRecPulse 1.4s infinite ease-in-out;
}

@keyframes liveRecPulse {
  0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.8); }
  70% { transform: scale(1.15); box-shadow: 0 0 0 7px rgba(255, 0, 0, 0); }
  100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
}
/* ============================================================== */

/* ================= דמויות צד: רכב (שמאל) ודמות (ימין) ================= */
.side-visual {
  position: fixed;
  bottom: calc(90px + 3vh);
  z-index: 0;
  pointer-events: none;
  -webkit-user-drag: none;
  user-select: none;
  animation: floatY 7s ease-in-out infinite;
  transition: bottom 0.3s ease, width 0.3s ease, height 0.3s ease;
}

.side-visual::after {
  content: '';
  position: absolute;
  left: 12%; right: 12%; bottom: -4px; height: 16px;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0.5) 0%, transparent 72%);
  filter: blur(1px);
}

@keyframes floatY {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

.side-car-container { left: 0; width: 330px; max-width: 30vw; height: auto; }

.side-car-container img {
  display: block; width: 100%; height: auto;
  filter: drop-shadow(0 10px 18px rgba(0,0,0,0.5));
}

.side-char-right { right: 0; height: 380px; max-height: 46vh; width: auto; animation-delay: -3.5s; }

.side-char-right img {
  display: block; height: 100%; width: auto;
  filter: drop-shadow(0 10px 16px rgba(0,0,0,0.5)) drop-shadow(0 0 14px rgba(255,178,50,0.10));
}

@media (max-width: 1024px) {
  .side-car-container { width: 250px; max-width: 34vw; }
  .side-char-right { height: 290px; max-height: 38vh; }
}

@media (max-width: 768px) {
  .side-visual { bottom: 96px; }
  .side-car-container { width: 130px; max-width: 30vw; }
  .side-char-right { height: 150px; max-height: 20vh; }
}

/* במסכים צרים אין מספיק מקום לדמויות הצד בלי לחפוף לכפתורים - מוסתרות לטובת בהירות */
@media (max-width: 560px) {
  .side-visual { display: none; }
}

  flex-direction: column;

.footer-links a { color: var(--muted); text-decoration: none; transition: color 0.2s; }
.footer-links a:hover { color: var(--gold); }

/* ================= 2. כפתורי קישור: כרטיס זכוכית עם צ'יפ פלטפורמה ================= */
.links-container {

  max-width: 340px;

  z-index: 1;

.link-btn {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 12px 16px;
  border-radius: 14px;
  text-decoration: none;
  font-size: 15.5px;
  font-weight: 600;
  color: var(--white);
  background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.02));
  border: 1px solid var(--line);
  box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 10px 22px rgba(0,0,0,0.35);
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
}

.link-btn:active { transform: translateY(0) scale(0.98); }

.link-btn:hover, .link-btn:focus-visible {
  transform: translateY(-3px);
  border-color: var(--accent);
  box-shadow: 0 1px 0 rgba(255,255,255,0.07) inset, 0 16px 30px var(--glow);
  outline: none;
}

.link-btn .icon-chip {
  flex-shrink: 0;
  width: 38px; height: 38px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px;
  background: var(--chip-bg);
  color: var(--chip-color);
  box-shadow: 0 4px 12px var(--glow);
}

.link-btn .label { flex: 1; text-align: start; }

.link-btn .chevron { font-size: 12px; opacity: 0.4; transition: opacity 0.18s ease, transform 0.18s ease; }
.link-btn:hover .chevron { opacity: 0.9; transform: translateX(-3px); }

.btn-kick     { --chip-bg: #53fc18; --chip-color: #06210a; --accent: #53fc18; --glow: rgba(83,252,24,0.32); }

}

.kick-svg-icon { width: 19px; height: 19px; display: inline-block; vertical-align: middle; fill: currentColor; }

.acc-header {

.acc-content { padding: 15px; max-height: 60vh; overflow-y: auto; }

.acc-section-title {

.acc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 22px; }

.acc-item {

body.grayscale { filter: grayscale(100%); }
body.high-contrast-mode { background: #000000; --white: #ffff00; --muted: #ffff88; }

<script>
document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.keyCode === 73)) { e.preventDefault(); }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'J' || e.key === 'j' || e.keyCode === 74)) { e.preventDefault(); }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'C' || e.key === 'c' || e.keyCode === 67)) { e.preventDefault(); }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'U' || e.key === 'u' || e.keyCode === 85)) { e.preventDefault(); }
});

async function checkKickLiveStatus() {
    const badge = document.getElementById('kickStatusBadge');
    const textSpan = document.getElementById('kickStatusText');
    if (!badge || !textSpan) return;
    try {
        const response = await fetch('https://kick.com/api/v2/channels/krav0n', {
            headers: { 'Accept': 'application/json' },
            cache: 'no-store'
        });
        if (response.ok) {
            const data = await response.json();
            const isLive = Boolean(data && data.livestream);
            if (isLive) {
                badge.classList.remove('offline');
                badge.classList.add('live');
                textSpan.textContent = 'LIVE';
                badge.style.pointerEvents = 'auto';
                badge.style.cursor = 'pointer';
                badge.onclick = function() {
                    window.open('https://kick.com/krav0n', '_blank', 'noopener,noreferrer');
                };
                badge.title = 'Krav0n is LIVE on Kick! Click to watch';
            } else {
                badge.classList.remove('live');
                badge.classList.add('offline');
                textSpan.textContent = 'OFFLINE';
                badge.style.pointerEvents = 'none';
                badge.style.cursor = 'default';
                badge.onclick = null;
                badge.title = 'Krav0n is OFFLINE';
            }
        } else {
            badge.classList.remove('live');
            badge.classList.add('offline');
            textSpan.textContent = 'OFFLINE';
            badge.style.pointerEvents = 'none';
            badge.style.cursor = 'default';
            badge.onclick = null;
        }
    } catch (err) {
        console.warn('Kick status check error:', err);
        badge.classList.remove('live');
        badge.classList.add('offline');
        textSpan.textContent = 'OFFLINE';
        badge.style.pointerEvents = 'none';
        badge.style.cursor = 'default';
        badge.onclick = null;
    }
}
checkKickLiveStatus();
setInterval(checkKickLiveStatus, 60000);

const canvas = document.getElementById('lightningCanvas');
const ctx = canvas.getContext('2d');
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
function drawBolt(startX, startY, length, angle, branchProbability, depth) {
  if (depth > 3) return;
  let currentX = startX, currentY = startY;
  ctx.beginPath();
  ctx.moveTo(currentX, currentY);
  ctx.shadowBlur = depth === 0 ? 14 : 5;
  ctx.shadowColor = "#ffc23c";
  ctx.strokeStyle = `rgba(255, 240, 200, ${0.85 - depth * 0.2})`;
  ctx.lineWidth = Math.max(1, 3 - depth);
  let segments = Math.floor(length / 10);
  for (let i = 0; i < segments; i++) {
    let segmentAngle = angle + (Math.random() - 0.5) * 1.5;
    currentX += Math.cos(segmentAngle) * 10;
    currentY += Math.sin(segmentAngle) * 10;
    ctx.lineTo(currentX, currentY);
    if (Math.random() < branchProbability) {
      let newAngle = angle + (Math.random() > 0.5 ? 1 : -1) * (0.5 + Math.random() * 0.5);
      drawBolt(currentX, currentY, length * 0.5, newAngle, branchProbability * 0.5, depth + 1);
      ctx.moveTo(currentX, currentY);
    }
  }
  ctx.stroke();
}
function strike() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let startX, startY, angle;
  const edge = Math.random();
  if (edge < 0.25) { startX = Math.random() * canvas.width; startY = 0; angle = Math.PI / 2; }
  else if (edge < 0.5) { startX = canvas.width; startY = Math.random() * canvas.height; angle = Math.PI; }
  else if (edge < 0.75) { startX = Math.random() * canvas.width; startY = canvas.height; angle = -Math.PI / 2; }
  else { startX = 0; startY = Math.random() * canvas.height; angle = 0; }
  let centerX = canvas.width / 2, centerY = canvas.height / 2;
  angle = Math.atan2(centerY - startY, centerX - startX) + (Math.random() - 0.5) * 0.5;
  drawBolt(startX, startY, canvas.height * 0.55, angle, 0.08, 0);
  setTimeout(() => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    setTimeout(strike, 4000 + Math.random() * 8000);
  }, 90);
}
setTimeout(strike, 2000);

const spotlight = document.getElementById('spotlight');
document.addEventListener('mousemove', (e) => {
  spotlight.style.setProperty('--x', `${e.clientX}px`);
  spotlight.style.setProperty('--y', `${e.clientY}px`);
});

const accBtn = document.getElementById('accBtn');
const accMenu = document.getElementById('accMenu');
const closeAccBtn = document.getElementById('closeAccBtn');
accBtn.addEventListener('click', () => accMenu.classList.toggle('active'));
closeAccBtn.addEventListener('click', () => accMenu.classList.remove('active'));
const body = document.body;
function clearActiveButtons() { document.querySelectorAll('.acc-item').forEach(btn => btn.classList.remove('active')); }
document.getElementById('contrastDark').addEventListener('click', function() { body.className = ''; body.classList.add('high-contrast-mode'); clearActiveButtons(); this.classList.add('active'); });
document.getElementById('contrastLight').addEventListener('click', function() { body.className = ''; body.classList.add('light-contrast-mode'); clearActiveButtons(); this.classList.add('active'); });
document.getElementById('contrastGray').addEventListener('click', function() { body.className = ''; body.classList.add('grayscale'); clearActiveButtons(); this.classList.add('active'); });
document.getElementById('textLarge').addEventListener('click', function() { body.classList.toggle('large-text-mode'); this.classList.toggle('active'); });
document.getElementById('accReset').addEventListener('click', function() { body.className = ''; clearActiveButtons(); });
</script>
